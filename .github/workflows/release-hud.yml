name: release-hud
on:
  push:
    tags: ["v*"]
  # Manual re-run (e.g. after fixing a signing secret) without tag surgery.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    strategy:
      # Don't let one platform's failure cancel the others: a release that ships Windows but not
      # Linux is far better than one that ships nothing.
      #
      # Exactly ONE `fail-fast` key. A duplicate is invalid YAML, and GitHub rejects the whole
      # workflow at startup — the run fails in 0s with "workflow file issue" and NOTHING builds.
      # That is how this file sat broken from the commit that dropped the macOS leg until the
      # v0.1.0 re-cut: releases are rare, so no one pushed a tag in between to notice.
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: "" }
          - { os: ubuntu-latest,  args: "" }
          # macOS is deliberately NOT built. It fails at compile time:
          #
          #   error[E0599]: no method named `transparent` found for struct `WebviewWindowBuilder`
          #
          # The HUD is a transparent, always-on-top overlay — that is what it IS — and Tauri gates
          # transparent windows on macOS behind the `macos-private-api` feature, which also bars
          # App Store distribution. Paying that to ship a build whose defining behaviours are
          # `#[cfg(windows)]` anyway (click-through, the WH_KEYBOARD_LL toggle hook, the
          # foreground-window auto-hide) is a bad trade, and starplatform's own release workflow
          # reaches the same conclusion from the other direction ("nobody runs the HUD on a Mac").
          #
          # Linux is kept because it BUILDS cleanly and costs nothing on a public repo's free
          # runners — the same "behaviours compiled out" caveat applies to it, but it needs no
          # private-API opt-in to produce an artifact.
          #
          # Re-adding macOS is a one-line matrix edit here, plus `macOSPrivateApi: true` in
          # hud/tauri.conf.json — decide about the App Store first.
          # - { os: macos-latest, args: "--target universal-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: hud
          tagName: ${{ github.ref_name }}
          releaseName: "StarPlatform HUD ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # REQUIRED: tauri.conf.json bundles both `nsis` and `msi`, and tauri-action defaults this
          # to false — i.e. it would build latest.json from the MSI, silently moving existing
          # -setup.exe users onto a different install path. Keep the updater on NSIS.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
