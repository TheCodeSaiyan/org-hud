name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel Windows when Linux fails. Windows is the platform this client actually
      # ships on — the click-through overlay, the WH_KEYBOARD_LL toggle hook and the
      # foreground-window auto-hide are all `#[cfg(windows)]` — so its result is the one that
      # matters most, and fail-fast was hiding it behind a Linux system-dependency error.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The `hud` crate is a Tauri app: it pulls glib-sys / webkit2gtk through pkg-config, and
      # `--all-targets` compiles it, so the Linux runner needs the GTK/WebKit dev libs or the
      # build dies with "The system library `glib-2.0` ... was not found".
      #
      # Kept in step with orgplatform's own ci.yml, which installs the same set for the same crate.
      - name: Install Tauri system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release
      # `--all-targets` matters: the Stream Deck drift guard in `hud/src/local_api.rs` is compiled
      # only into the TEST binary, so a plain `cargo build` cannot catch it going stale or its
      # `include_str!` paths breaking.
      - run: cargo test --all
